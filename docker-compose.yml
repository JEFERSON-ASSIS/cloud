services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: i7ai_cloud
      POSTGRES_USER: i7ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U i7ai -d i7ai_cloud"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    networks: ["internal"]
    restart: unless-stopped
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"
    volumes: ["redis_data:/data"]
    networks: ["internal"]
    restart: unless-stopped
  web:
    build: { context: ".", target: "web" }
    env_file: [".env"]
    ports: ["${APP_PORT:-3001}:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: ["internal", "edge"]
    restart: unless-stopped
  worker:
    build: { context: ".", target: "worker" }
    env_file: [".env"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks: ["internal"]
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
networks:
  internal:
  edge:
