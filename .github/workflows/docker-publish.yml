name: Build and Push Docker Images to GHCR

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Lowercase Image Names
        id: repository
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME_WEB=ghcr.io/${OWNER_LOWER}/i7ai-cloud-manager-web" >> $GITHUB_ENV
          echo "IMAGE_NAME_WORKER=ghcr.io/${OWNER_LOWER}/i7ai-cloud-manager-worker" >> $GITHUB_ENV

      - name: Build and Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: web
          push: true
          tags: |
            ${{ env.IMAGE_NAME_WEB }}:latest
            ${{ env.IMAGE_NAME_WEB }}:main

      - name: Build and Push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: worker
          push: true
          tags: |
            ${{ env.IMAGE_NAME_WORKER }}:latest
            ${{ env.IMAGE_NAME_WORKER }}:main
